; 0x50 bytes (objects 0x50 apart). ConstructFn 0x0 (a code address in all 31 classes), CastFlags 0x10 (the
; type bit plus the parent's bits), Id 0x18 (one bit, different in each class), SuperClass 0x20, Name 0x30
; (checked in the name pool: BoolProperty 0x11, TextProperty 0x68, StructProperty 0x48 and 7 more). 0x40
; and 0x48 are fields the game added (0x800004da.. numbered in order). ClassFlags, DefaultObject and
; UniqueNameIndexCounter are 0 in every class; their slots 0x8, 0x28 and 0x38 are the free ones.
[FFieldClass]
; template 0x30
