ClassFlags = 0x8
; template 0x18
CastFlags = 0x10
; template 0x10
Id = 0x18
SuperClass = 0x20
DefaultObject = 0x28
; template 0x0
Name = 0x30
UniqueNameIndexCounter = 0x38
; template 0x40
UEP_TotalSize = 0x50

