; PBZ Steam UE 5.7: UObjectBaseInit and FUObjectArray::FreeUObjectIndex.
[TUObjectArray]
MaxChunks = 0x0
NumChunks = 0x4
Objects = 0x8
NumElements = 0x10
MaxElements = 0x14
PreAllocatedObjects = 0x18
UEP_TotalSize = 0x20

; Native AddUObjectDeleteListener; +0x80 is the create-listener lock. The static destructor's last member is
; the delete-listener lock at +0xB8 (0x28 bytes), followed by the serial counter and recycle flag; the next
; global starts at +0xE8.
[FUObjectArray]
UObjectDeleteListeners = 0xA8
PrimarySerialNumber = 0xE0
bShouldRecycleObjectIndices = 0xE4
UEP_TotalSize = 0xE8

; AddCppProperty and UStruct::Link use Next +0x10, tagged Owner +0x18.
[FField]
ClassPrivate = 0x8
Next = 0x10
Owner = 0x18
NamePrivate = 0x20
FlagsPrivate = 0x28
UEP_TotalSize = 0x30

; Static initialization guard is at +0x40, outside the class storage.
[FFieldClass]
ConstructFn = 0x0
ClassFlags = 0x8
CastFlags = 0x10
Id = 0x18
SuperClass = 0x20
DefaultObject = 0x28
Name = 0x30
UniqueNameIndexCounter = 0x38
UEP_TotalSize = 0x40

; Native UStruct constructors insert a 0x50-byte map after ChildProperties.
[UStruct]
SuperStruct = 0x40
Children = 0x48
ChildProperties = 0x50
PropertiesSize = 0xA8
MinAlignment = 0xAC
StructStateFlags = 0xAE
Script = 0xB0
PropertyLink = 0xC0
RefLink = 0xC8
DestructorLink = 0xD0
PostConstructLink = 0xD8
ScriptAndPropertyObjectReferences = 0xE0
UnresolvedScriptProperties = 0xF0
UEP_TotalSize = 0x100

; UClass registration size, constructor, Serialize, and CreateDefaultObject.
[UClass]
ClassConstructor = 0x100
ClassVTableHelperCtorCaller = 0x108
ClassUnique = 0x118
FirstOwnedClassRep = 0x11C
bCooked = 0x120
bLayoutChanging = 0x121
ClassFlags = 0x124
ClassCastFlags = 0x128
ClassWithin = 0x130
ClassConfigName = 0x138
NetFields = 0x150
ClassDefaultObject = 0x160
SparseClassData = 0x168
SparseClassDataStruct = 0x170
bNeedsDynamicSubobjectInstancing = 0x178
FuncMap = 0x180
FuncMapLock = 0x1D0
AllFunctionsCache = 0x1D8
AllFunctionsCacheLock = 0x228
Interfaces = 0x230
ReferenceSchema = 0x240
NativeFunctionLookupTable = 0x248
UEP_TotalSize = 0x258

; UFunction registration size, Serialize, ProcessEvent, and Bind.
[UFunction]
FunctionFlags = 0x100
NumParms = 0x104
ParmsSize = 0x106
ReturnValueOffset = 0x108
FirstPropertyToInit = 0x110
EventGraphFunction = 0x118
EventGraphCallOffset = 0x120
Func = 0x128
; ConstructUFunction stores RPCId/RPCResponseId at +0x10A/+0x10C (UE4SS's 5.7 default 0xBA/0xBC is inside UStruct::Script).
RPCId = 0x10A
RPCResponseId = 0x10C
UEP_TotalSize = 0x130

; UScriptStruct registration size and InternalConstructor.
[UScriptStruct]
StructFlags = 0x100
bPrepareCppStructOpsCompleted = 0x104
CppStructOps = 0x108
UEP_TotalSize = 0x110

; PBZ adds two bitfields at the start of the 0x5D byte: reflection puts bActorEnableCollision at 0x5D bit 2,
; bActorIsBeingDestroyed bit 3, bAsyncPhysicsTickEnabled at 0x5E bit 1 and the overlap enums/RemoteRole one byte
; later; live actors that have begun play have ActorHasBegunPlay = 2 in bits 5-6.
[AActor]
bActorEnableCollision = 0x5D:2
bActorIsBeingDestroyed = 0x5D:3
bActorWantsDestroyDuringBeginPlay = 0x5D:4
ActorHasBegunPlay = 0x5D:5:2
bActorIsBeingConstructed = 0x5D:7
bActorIsPendingPostNetInit = 0x5E:0
bAsyncPhysicsTickEnabled = 0x5E:1
UpdateOverlapsMethodDuringLevelStreaming = 0x5F
DefaultUpdateOverlapsMethodDuringLevelStreaming = 0x60
RemoteRole = 0x61
ActorCategory = 0x62

; PBZ inserts 8 bytes after URL: PlayerNum's 5.7 slot holds a UWorld pointer, the clock doubles are read from
; 0x848.. (485 code reads of TimeSeconds there), CleanupWorld compares CleanupWorldTag at +0x8F4, and the
; reflected size is 0xB18.
[UWorld]
PlayerNum = 0x7F0
StreamingVolumeUpdateDelay = 0x7F4
PostProcessVolumeCachedSizes = 0x820
LastTimeUnbuiltLightingWasEncountered = 0x840
TimeSeconds = 0x848
UnpausedTimeSeconds = 0x850
RealTimeSeconds = 0x858
AudioTimeSeconds = 0x860
DeltaRealTimeSeconds = 0x868
DeltaTimeSeconds = 0x86C
PauseDelay = 0x870
NextSwitchCountdown = 0x8A8
NumStreamingLevelsBeingLoaded = 0x8C2
NextURL = 0x8C8
PreparingLevelNames = 0x8D8
CommittedPersistentLevelName = 0x8E8
bMarkedObjectsPendingKill = 0x8F0:0:1:4
CleanupWorldTag = 0x8F4
UEP_TotalSize = 0xB18
