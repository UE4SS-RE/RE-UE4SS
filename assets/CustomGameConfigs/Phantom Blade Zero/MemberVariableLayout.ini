; checked).

; 0x28 bytes more at 0x80: a critical section (spin count 4000 at 0xA0, like the standard ones at 0x30 and
; 0xB8). UObjectDeleteListeners (7 listeners with vtables) at 0xA8, PrimarySerialNumber at 0xE0 (33215 =
; the highest SerialNumber in the object items), bShouldRecycleObjectIndices at 0xE4 (1). Before 0x80 as
; in the template (ObjAvailableList 5029 indices at 0x58, UObjectCreateListeners 2 at 0x70).
[FUObjectArray]
ObjFirstGCIndex = 0x0
ObjLastNonGCIndex = 0x4
MaxObjectsNotConsideredByGC = 0x8
