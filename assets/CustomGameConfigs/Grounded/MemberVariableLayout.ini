; The other 33 UWorld bitfield bools are left out on purpose. A bool was inserted in
; 0x15B..0x15E, so stock bits are wrong past it and reflection cannot place them. UE4SS uses
; its defaults, and no UE4SS code reads them anyway.
; To place them later, find the bit UWorld::Tick sets on entry and clears on exit, which is
; bInTick, and count from there.
